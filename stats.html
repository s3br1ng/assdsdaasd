<!DOCTYPE html>
<html lang="en">
<head>
    <title>Статистика заявок</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8" />
</head>
<body>
    <a href="getorders.html">Все заявки</a>
    <a href="inputorders.html">Создание заявки</a>
    <a href="updateorders.html">Обновление заявки</a>
    <a href="stats.html">Статистика по заявкам</a>
    <a href="findorder.html">Поиск заявки по номеру</a>
    <table>
        <tr>
            <th>Параметр</th>
            <th>Значение</th>
        </tr>
    </table>
    <script>
        let table = document.querySelector("table");
        get_stats();
        async function get_stats() {
            let response = await fetch("http://127.0.0.1:8000/stats");
            let stats = await response.json();

            let rows = [
                { key: "Количество готовых заявок", value: stats["Количество готовых заявок"]},
                { key: "Среднее количество дней", value: stats["Среднее количество дней"]},
                { key: "Статистика по типам неисправностей", value: formatProblemTypes(stats["Статистика по типам неисправностей"])}
            ];

            rows.forEach(row => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                <td>${row.key}</td>
                <td>${row.value}</td>
                `;
                table.appendChild(tr);
            });
        }

        function formatProblemTypes(problemTypes) {
            if (!problemTypes || Object.keys(problemTypes).length === 0) {
                return "";
            }
            return Object.entries(problemTypes).map(([type, count]) => `${type}: ${count}`).join(", ");
        }
    </script>
</body>
</html>
